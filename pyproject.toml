[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netguardian"
version = "3.1.1"
description = "Adaptive route manager that pins host names to reachable addresses through the Windows hosts file"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Svetliak" }]
keywords = ["windows", "hosts", "dns", "networking", "tls", "diagnostics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.scripts]
netguardian = "netguardian.cli:main"

[tool.setuptools]
packages = ["netguardian"]

[tool.setuptools.package-data]
netguardian = ["py.typed"]
